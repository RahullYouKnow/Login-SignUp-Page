<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="signUp.css" />
  </head>
  <body>
    <main>
      <section>
        <div class="head">
          <h2>Login to <span id="head">Chatly</span></h2>
        </div>
        <div class="main">
          <form>
            <div class="username">
              <input type="text" placeholder="username" id="user" class="inp" />
              <small id="userError" class="error"></small>
            </div>
            <div class="email">
              <input type="email" id="email" placeholder="email" class="inp" />
              <small id="emailError" class="error"></small>
            </div>
            <div class="password">
              <div id="pass">
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="password"
                  class="inp"
                />
                <span id="show">Show</span>
              </div>
              <small id="passError" class="error"></small>
            </div>
            <div class="btn">
              <button type="submit">SignUp</button>
              <small id="signUpError" class="error"></small>
            </div>
          </form>
          <p>
            <a href="index.html"
              >Alread have a account? <span id="a">Login</span></a
            >
          </p>
        </div>
      </section>
    </main>
    <script src="signUp.js"></script>
  </body>
</html>
